<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900'>
  <defs>
    <linearGradient id='sky' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#0f89da'/>
      <stop offset='0.65' stop-color='#20a2e8'/>
      <stop offset='1' stop-color='#8fd0f6'/>
    </linearGradient>
    <linearGradient id='facadeA' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#e6ddcf'/>
      <stop offset='1' stop-color='#cbbda8'/>
    </linearGradient>
    <linearGradient id='facadeB' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#ddd2c1'/>
      <stop offset='1' stop-color='#bfaf98'/>
    </linearGradient>
  </defs>

  <rect width='1600' height='900' fill='url(#sky)'/>

  <!-- Left trees -->
  <g>
    <rect x='52' y='75' width='20' height='350' fill='#4c3b2a'/>
    <circle cx='90' cy='130' r='70' fill='#5a6f39' opacity='0.95'/>
    <circle cx='38' cy='170' r='56' fill='#4f6732' opacity='0.92'/>
    <circle cx='125' cy='190' r='52' fill='#688245' opacity='0.9'/>
    <circle cx='64' cy='235' r='62' fill='#7c8d59' opacity='0.88'/>
  </g>

  <!-- Buildings resembling Paris Haussmann -->
  <g stroke='#9c8d78' stroke-width='2'>
    <rect x='120' y='310' width='330' height='390' fill='url(#facadeA)'/>
    <rect x='430' y='280' width='330' height='420' fill='url(#facadeA)'/>
    <rect x='730' y='330' width='250' height='370' fill='url(#facadeB)'/>
    <rect x='980' y='260' width='350' height='440' fill='url(#facadeA)'/>
  </g>

  <!-- Roofs -->
  <g fill='#495465'>
    <polygon points='120,310 280,235 450,310'/>
    <polygon points='430,280 595,200 760,280'/>
    <polygon points='730,330 855,255 980,330'/>
    <polygon points='980,260 1155,185 1330,260'/>
  </g>

  <!-- Windows -->
  <g fill='#2f3744'>
    <rect x='160' y='360' width='28' height='46'/><rect x='210' y='360' width='28' height='46'/><rect x='260' y='360' width='28' height='46'/><rect x='310' y='360' width='28' height='46'/><rect x='360' y='360' width='28' height='46'/>
    <rect x='160' y='430' width='28' height='46'/><rect x='210' y='430' width='28' height='46'/><rect x='260' y='430' width='28' height='46'/><rect x='310' y='430' width='28' height='46'/><rect x='360' y='430' width='28' height='46'/>
    <rect x='470' y='335' width='30' height='48'/><rect x='525' y='335' width='30' height='48'/><rect x='580' y='335' width='30' height='48'/><rect x='635' y='335' width='30' height='48'/><rect x='690' y='335' width='30' height='48'/>
    <rect x='470' y='410' width='30' height='48'/><rect x='525' y='410' width='30' height='48'/><rect x='580' y='410' width='30' height='48'/><rect x='635' y='410' width='30' height='48'/><rect x='690' y='410' width='30' height='48'/>
    <rect x='1025' y='320' width='33' height='50'/><rect x='1085' y='320' width='33' height='50'/><rect x='1145' y='320' width='33' height='50'/><rect x='1205' y='320' width='33' height='50'/><rect x='1265' y='320' width='33' height='50'/>
    <rect x='1025' y='400' width='33' height='50'/><rect x='1085' y='400' width='33' height='50'/><rect x='1145' y='400' width='33' height='50'/><rect x='1205' y='400' width='33' height='50'/><rect x='1265' y='400' width='33' height='50'/>
  </g>

  <!-- Foreground greenery -->
  <g>
    <ellipse cx='250' cy='760' rx='300' ry='120' fill='#4d6a3f'/>
    <ellipse cx='520' cy='770' rx='300' ry='120' fill='#567746'/>
    <ellipse cx='780' cy='770' rx='320' ry='115' fill='#4b6a3d'/>
    <ellipse cx='1080' cy='770' rx='300' ry='125' fill='#5f7d4c'/>
  </g>
</svg>
